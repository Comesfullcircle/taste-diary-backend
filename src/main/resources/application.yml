spring:
  application:
    name: taste-diary
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/taste_diary}
    username: ${DB_USERNAME:taste_diary_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
